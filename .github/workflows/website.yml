name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website

      # Push website/dist into the gh-pages branch, which GitHub Pages serves
      # (branch-based deployment; the gh-pages npm package does the same thing
      # locally via `npm run deploy`). .nojekyll is added so Pages skips
      # Jekyll processing.
      - name: Publish to gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          commit_message: 'chore(website): publish gh-pages [skip ci]'
