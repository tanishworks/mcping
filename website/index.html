<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta
            name="description"
            content="mcping — lightweight Minecraft (Java Edition) server status CLI: player counts, player names and latency without joining the server."
        />
        <meta name="color-scheme" content="light dark" />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: light)"
            content="#ffffff"
        />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: dark)"
            content="#000000"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32.png?v=3"
            media="(prefers-color-scheme: dark)"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32-light.png?v=3"
            media="(prefers-color-scheme: light)"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png?v=2"
        />
        <title>mcping · Minecraft server status CLI</title>
        <script>
            // Set the theme before first paint to avoid a flash of the wrong scheme.
            // ThemeProvider keeps this in sync afterwards.
            try {
                document.documentElement.dataset.theme = window.matchMedia(
                    '(prefers-color-scheme: dark)',
                ).matches
                    ? 'dark'
                    : 'light';
            } catch {
                document.documentElement.dataset.theme = 'light';
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
